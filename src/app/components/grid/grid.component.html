<!-- Navbar Componente Reutilizable -->
<app-navbar></app-navbar>

<!-- Game Page Hero Background -->
<div class="game-page-wrapper">
  <!-- Background blobs like the home page -->
  <div class="hero-bg-gradients">
    <div class="gradient-sphere blob-1"></div>
    <div class="gradient-sphere blob-2"></div>
    <div class="gradient-sphere blob-3"></div>
  </div>

  <div class="game-container position-relative z-index-1">

    <!-- Game Header -->
    <div class="game-header text-center mb-4 animate-slide-up">
      <span class="badge badge-premium px-3 py-2 rounded-pill mb-2 text-uppercase font-monospace tracking-wide">
        🎮 Modo Puzzle Activo
      </span>
      <h1 class="game-title text-white fw-bold mb-1">Tablero <span class="text-gradient-gold">Shikaku</span></h1>
      <p class="text-white-50 small font-monospace mb-0">Nivel {{ currentLevel }} - {{ currentDifficulty | titlecase }}</p>
    </div>

    <!-- Grid Card -->
    <div class="game-card animate-fade-in-delayed">

      <!-- Tarjeta del temporizador premium -->
      <div class="timer-container mb-4">
        <div class="timer-card d-flex align-items-center justify-content-center gap-3 py-2 px-4 rounded-pill">
          <span class="timer-icon">⏱️</span>
          <div class="d-flex flex-column align-items-start">
            <span class="timer-label text-uppercase fw-bold">Tiempo</span>
            <span class="timer-value font-monospace">{{ formattedTime }}</span>
          </div>
          <div class="timer-divider mx-2"></div>
          <button class="btn-timer-reset d-flex align-items-center justify-content-center" (click)="reset()" title="Reiniciar tablero">
            🔄
          </button>
        </div>
      </div>

      <!-- Shikaku Grid -->
      <div
        class="game-grid"
        *ngIf="board"
        (mouseleave)="onMouseLeave()"
      >
        <div class="grid-row" *ngFor="let row of board.cells; let r = index">
          <div
            class="grid-cell"
            *ngFor="let cell of row; let c = index"
            [style.background-color]="getRectColor(r, c)"
            [ngClass]="getCellClasses(r, c)"
            (mousedown)="onCellMouseDown(r, c)"
            (mousemove)="onCellMouseMove(r, c)"
            (mouseup)="onCellMouseUp(r, c)"
          >
            <span *ngIf="cell !== 0">{{ cell }}</span>
          </div>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="game-feedback victory-panel mt-4" *ngIf="validationStatus === 'success'">
        <h3 class="feedback-title">&#127881; Puzzle completado!</h3>
        <p class="feedback-line">Tiempo total: <strong>{{ formattedTime }}</strong></p>
        <p class="feedback-line">Nivel: <strong>{{ currentLevel }}</strong></p>
        <button class="btn-next d-inline-flex align-items-center gap-2 mt-2" (click)="nextLevel()">
          <span class="btn-text">Siguiente Nivel</span>
        </button>
      </div>

      <div class="game-feedback error-panel mt-4" *ngIf="validationStatus === 'error'">
        <p class="feedback-line mb-0">{{ validationMessage }}</p>
      </div>

      <div class="game-feedback hint-panel mt-4" *ngIf="hintMessage">
        <p class="feedback-line mb-0">{{ hintMessage }}</p>
      </div>

      <div class="solver-selector mt-4" *ngIf="showSolverSelector">
        <h3 class="solver-title">Selecciona el solucionador</h3>

        <label class="solver-option">
          <input type="radio" name="solverType" [checked]="solverType === 'bt'" (change)="setSolverType('bt')" />
          <span>Backtracking</span>
        </label>

        <label class="solver-option">
          <input type="radio" name="solverType" [checked]="solverType === 'cp'" (change)="setSolverType('cp')" />
          <span>Backtracking + Constraint Propagation</span>
        </label>

        <button class="btn-solve d-inline-flex align-items-center gap-2 mt-3" (click)="solve()" [disabled]="isSolving">
          <span class="btn-text">Resolver</span>
        </button>
      </div>

      <div class="action-buttons-container mt-4 d-flex gap-3 justify-content-center flex-wrap">
        <button class="btn-verify d-flex align-items-center gap-2" (click)="checkVictory()">
          <span class="btn-icon">✔️</span>
          <span class="btn-text">Verificar Respuesta</span>
        </button>

        <button class="btn-solve d-flex align-items-center gap-2" (click)="openSolverSelector()">
          <span class="btn-icon">💡</span>
          <span class="btn-text">Resolver Puzzle</span>
        </button>

        <button class="btn-verify d-flex align-items-center gap-2" (click)="getHint()">
          <span class="btn-icon">?</span>
          <span class="btn-text">Pista</span>
        </button>

        <button class="btn-next d-flex align-items-center gap-2" (click)="nextLevel()">
          <span class="btn-icon">⏭️</span>
          <span class="btn-text">Siguiente Nivel</span>
        </button>
        <button class="btn-verify d-flex align-items-center gap-2" (click)="newGame()">
          <span class="btn-icon">+</span>
          <span class="btn-text">Nueva Partida</span>
        </button>
      </div>

    </div><!-- /game-card -->

  </div><!-- /game-container -->
</div><!-- /game-page-wrapper -->
