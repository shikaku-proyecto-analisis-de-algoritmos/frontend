<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow registro-card">

    <div class="card-body p-4">

      <h2 class="text-center mb-4 titulo">
        Iniciar Sesión
      </h2>

      <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">

        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input 
            type="text"
            class="form-control"
            [(ngModel)]="usuario"
            name="usuario"
            placeholder="Ingresa tu usuario"
            #usuarioModel="ngModel"
            required
          >
          <div *ngIf="usuarioModel.invalid && usuarioModel.touched" class="text-danger small">
            El nombre de usuario es obligatorio.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input 
            type="password"
            class="form-control"
            [(ngModel)]="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            #passwordModel="ngModel"
            required
            minlength="6"
          >
          <div *ngIf="passwordModel.invalid && passwordModel.touched" class="text-danger small">
            La contraseña debe tener al menos 6 caracteres.
          </div>
        </div>

        <button class="btn btn-primary w-100 mt-3" type="submit" [disabled]="loginForm.invalid">
          Entrar
        </button>

        <p class="text-center mt-3 small">
          ¿No tienes cuenta? 
          <a routerLink="/registro">Regístrate aquí</a>
        </p>

      </form>

    </div>
  </div>
</div>
