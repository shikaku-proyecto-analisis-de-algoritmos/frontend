<!-- Navbar Componente Reutilizable -->
<app-navbar></app-navbar>

<!-- Register Page con fondo oscuro del home -->
<div class="auth-page-wrapper">
  <!-- Background blobs -->
  <div class="hero-bg-gradients">
    <div class="gradient-sphere blob-1"></div>
    <div class="gradient-sphere blob-2"></div>
  </div>

  <div class="auth-container position-relative z-index-1">
    <div class="auth-card animate-slide-up shadow">

      <div class="auth-card-header text-center mb-4">
        <span class="logo-icon-lg">
          <img
            src="assets/logo.png"
            alt="Shikaku"
            class="logo-image"
          />
        </span>
        <h2 class="text-white fw-bold mb-1 mt-2">Registro Shikaku</h2>
        <p class="text-white-50 small mb-0 font-monospace">Únete al desafío lógico</p>
      </div>

      <form (ngSubmit)="registrar()" #registroForm="ngForm">
        <div *ngIf="successMessage" class="alert-success mb-3">{{ successMessage }}</div>
        <div *ngIf="errorMessage" class="alert-error mb-3">{{ errorMessage }}</div>

        <div class="mb-3">
          <label class="form-label text-white-50 fw-bold small text-uppercase tracking-wide">Usuario</label>
          <input
            type="text"
            class="form-control auth-input"
            [(ngModel)]="usuario"
            name="usuario"
            placeholder="Ingresa tu usuario"
            #usuarioModel="ngModel"
            required
          >
          <div *ngIf="usuarioModel.invalid && usuarioModel.touched" class="text-warning small mt-1">
            El nombre de usuario es obligatorio.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-white-50 fw-bold small text-uppercase tracking-wide">Correo</label>
          <input
            type="email"
            class="form-control auth-input"
            [(ngModel)]="correo"
            name="correo"
            placeholder="Ingresa tu correo"
            #correoModel="ngModel"
            required
            email
          >
          <div *ngIf="correoModel.invalid && correoModel.touched" class="text-warning small mt-1">
            Ingresa un correo electrónico válido.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-white-50 fw-bold small text-uppercase tracking-wide">Contraseña</label>
          <input
            type="password"
            class="form-control auth-input"
            [(ngModel)]="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            #passwordModel="ngModel"
            required
            minlength="6"
          >
          <div *ngIf="passwordModel.invalid && passwordModel.touched" class="text-warning small mt-1">
            La contraseña debe tener al menos 6 caracteres.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-white-50 fw-bold small text-uppercase tracking-wide">Confirmar Contraseña</label>
          <input
            type="password"
            class="form-control auth-input"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Repite tu contraseña"
            #confirmPasswordModel="ngModel"
            required
            minlength="6"
          >
          <div *ngIf="confirmPasswordModel.invalid && confirmPasswordModel.touched" class="text-warning small mt-1">
            La confirmacion debe tener al menos 6 caracteres.
          </div>
        </div>

        <button class="btn-auth-primary w-100 mt-3" type="submit" [disabled]="registroForm.invalid || isLoadingGoogle">
          Crear Cuenta
        </button>

        <div class="auth-divider">
          <span>o</span>
        </div>

        <div class="google-button-wrapper" #googleRegisterBtn></div>

        <p class="text-center mt-4 text-white-50 small">
          ¿Ya tienes cuenta?
          <a class="text-accent-gold fw-bold" routerLink="/login">Inicia sesión aquí</a>
        </p>

      </form>

    </div>
  </div>
</div>
